# カーシェア vs レンタカー 料金比較ツール設定

# デフォルト入力値
defaults:
  vehicleType: compact # compact | compactMinivan | minivan
  days: 1
  hours: 0
  distance: 100
  hasRefuel: true # 給油をする（20L以上）
  hasWash: true # 水洗い洗車をする
  hasCarShareInsurance: true # 安心補償サービス（550円）
  tollFee: 0
  fuelPrice: 145 # 円/L
  # レンタカー設定
  isMember: true # 会員料金 or 通常料金
  insuranceType: basic # none | basic | premium - 免責補償がデフォルト

# 入力制限
limits:
  hours:
    min: 1
    max: 240
  distance:
    min: 0
    max: 3000
  tollFee:
    min: 0
    max: 100000

# タイムズカーシェア料金
carShare:
  # 距離料金が発生する閾値（km）- 超えた分だけ課金
  distanceChargeThresholdKm: 20
  
  # 安心補償サービス（1利用あたり）
  insurancePerUse: 550
  
  # 給油・洗車割引（分単位）
  # 給油: 30分割引、洗車: 30分割引、両方: 60分割引
  discountMinutes:
    refuelOnly: 30
    washOnly: 30
    refuelAndWash: 60
  
  vehicles:
    compact:
      name: ベーシック
      description: コンパクトカー（2〜4名向け）
      # 15分単位料金
      rate15min: 220
      # 最大時間料金テーブル
      maxRates:
        - maxHours: 6
          maxPrice: 4290
        - maxHours: 12
          maxPrice: 5500
        - maxHours: 24
          maxPrice: 6600
        - maxHours: 36
          maxPrice: 8800
        - maxHours: 48
          maxPrice: 9900
        - maxHours: 72
          maxPrice: 14300
      # 72時間以降、1日毎の追加料金
      dailyRateAfter72h: 5500
      distanceRate: 20

    compactMinivan:
      name: ミドル
      description: コンパクトミニバン（4〜6名向け）
      rate15min: 330
      maxRates:
        - maxHours: 6
          maxPrice: 6490
        - maxHours: 12
          maxPrice: 7700
        - maxHours: 24
          maxPrice: 8800
        - maxHours: 36
          maxPrice: 11000
        - maxHours: 48
          maxPrice: 13200
        - maxHours: 72
          maxPrice: 18700
      dailyRateAfter72h: 6600
      distanceRate: 20

    minivan:
      name: プレミアム
      description: ミニバン（6〜8名向け）
      rate15min: 440
      maxRates:
        - maxHours: 6
          maxPrice: 8690
        - maxHours: 12
          maxPrice: 9900
        - maxHours: 24
          maxPrice: 12100
        - maxHours: 36
          maxPrice: 17600
        - maxHours: 48
          maxPrice: 20900
        - maxHours: 72
          maxPrice: 27500
      dailyRateAfter72h: 7700
      distanceRate: 20

